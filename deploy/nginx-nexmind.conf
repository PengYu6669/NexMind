# NexMind vhost — 与宿主机已有 nginx 共存的接入方式。
# 用法：
#   sudo cp deploy/nginx-nexmind.conf /etc/nginx/sites-available/nexmind.deepsuckk.cloud
#   sudo ln -s /etc/nginx/sites-available/nexmind.deepsuckk.cloud /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d nexmind.deepsuckk.cloud   # 自动加 TLS + 301
server {
    listen 80;
    server_name nexmind.deepsuckk.cloud;

    # 笔记/文件上传
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE（聊天流/学习任务事件）：必须关缓冲，否则前端收不到流式输出
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
